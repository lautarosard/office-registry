# PRODUCTION stack. Configuration comes from ./.env (see .env.example).
#   docker compose up -d --build
#
# The project name differs from backend/docker-compose.yml (development
# database), so the two never share containers or data.
name: office-registry-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-registerdb}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build: ./backend
    image: office-registry-backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      # The password goes inside a URL: use only letters and digits.
      DATABASE_URL: postgresql://${POSTGRES_USER:-registry}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-registerdb}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      LOGIN_THROTTLE_LIMIT: ${LOGIN_THROTTLE_LIMIT:-5}
      LOGIN_THROTTLE_TTL_SECONDS: ${LOGIN_THROTTLE_TTL_SECONDS:-60}
      # Exactly one proxy in front: Nginx, in the frontend service.
      TRUST_PROXY: "1"
      # The browser uses the same origin; no other origin needs access.
      CORS_ORIGIN: http://localhost
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Not published: only reachable through Nginx.
    networks: [internal]
    logging: *logging

  frontend:
    build: ./frontend
    image: office-registry-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks: [internal, public]
    logging: *logging

networks:
  # No route to the outside: the database and the API work fully offline.
  internal:
    internal: true
  # Only so that Nginx can publish its port on the LAN.
  public:

volumes:
  db_data:
