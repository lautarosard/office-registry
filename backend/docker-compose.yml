# Development database. Values are read from backend/.env (see .env.example).
# Phase 3 replaces this with a root compose file (Postgres + API + Nginx).
name: office-registry

services:
  db:
    image: postgres:16-alpine
    container_name: office_registry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-registerdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; change POSTGRES_PORT if 5432 is already taken.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-registry} -d ${POSTGRES_DB:-registerdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
