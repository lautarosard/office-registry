server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Above the API's own 5 MB limit, so that the API is the one that answers
    # (in Spanish) when a spreadsheet is too large.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, re-queried so a recreated backend is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        # Overwritten, not appended: whatever the client sent is discarded.
        # The API uses this address for the login rate limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large imports and exports.
        proxy_read_timeout 180s;
    }

    # File names carry a content hash.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are routes of the frontend.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
